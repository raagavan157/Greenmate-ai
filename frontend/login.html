<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - GreenMate AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background:var(--mint-bg); min-height:100vh; display:flex; flex-direction:column;">

  <!-- Simple Header -->
  <header style="background:#ffffff; border-bottom:1px solid var(--border-light); padding:16px 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="/" class="brand-logo">
        <svg class="logo-leaf" viewBox="0 0 32 32" fill="none">
          <path d="M6 26C6 26 8 16 18 10C28 4 28 4 28 4C28 4 28 14 22 20C16 26 6 26 6 26Z" fill="#133e29"/>
          <path d="M11 23C15 19 20 15 28 4" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>GreenMate <span class="ai-suffix">AI</span></span>
      </a>
      <a href="/" style="font-weight:700; color:var(--primary-forest); font-size:0.9rem;">← Back to Home</a>
    </div>
  </header>

  <!-- Auth Card Container -->
  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;">
    <div style="background:#ffffff; width:100%; max-width:440px; border-radius:24px; padding:36px; box-shadow:var(--shadow-lg); border:1px solid var(--border-light);">
      
      <div style="text-align:center; margin-bottom:28px;">
        <span style="font-size:2rem;">🌱</span>
        <h2 style="font-size:1.8rem; font-weight:800; color:var(--primary-forest); margin-top:8px;">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Sign in to access your personal garden and care reminders.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" style="margin-bottom:0;">Password</label>
            <a href="#" onclick="handleForgotPassword(event)" style="font-size:0.75rem; color:var(--primary-emerald); font-weight:600;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primary-solid" style="width:100%; padding:12px; font-size:0.95rem; margin-top:10px;">
          Sign In
        </button>

        <button type="button" onclick="fillDemoAccount()" class="btn-secondary" style="width:100%; padding:10px; font-size:0.85rem; margin-top:10px; border-radius:var(--radius-full);">
          ⚡ Quick Demo Login
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-muted); border-top:1px solid var(--border-light); padding-top:20px;">
        Don't have an account yet? 
        <a href="/register.html" style="font-weight:700; color:var(--primary-forest); text-decoration:underline;">Create an account</a>
      </div>

    </div>
  </main>

  <footer style="text-align:center; padding:16px; font-size:0.8rem; color:#87998e;">
    © 2026 GreenMate AI. Protected by secure JWT authentication.
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px; height:16px;"></span> Signing In...';

      try {
        await Auth.login(email, password);
        App.showToast('Welcome back! 🌿', 'success');
        
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/my-garden.html';
        setTimeout(() => {
          window.location.href = redirect;
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
        App.showToast(err.message, 'error');
      }
    });

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = prompt('Enter your registered email address to receive password reset instructions:');
      if (email && email.trim()) {
        try {
          const res = await API.request('/api/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ email: email.trim() })
          });
          App.showToast(res.message, 'success');
        } catch (err) {
          App.showToast(err.message, 'error');
        }
      }
    }

    async function fillDemoAccount() {
      document.getElementById('login-email').value = 'demo@greenmate.ai';
      document.getElementById('login-password').value = 'GreenMate2026!';
      
      // Auto register if demo user doesn't exist yet
      try {
        await Auth.register('Botanical Explorer', 'demo@greenmate.ai', 'GreenMate2026!');
      } catch (e) {
        // Already registered, proceed to login
      }
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
